<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShareMe OAuth 回调</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      color: #1a1a1a;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
    }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { margin: 0 0 12px; line-height: 1.5; color: #475569; font-size: 15px; }
    a.btn {
      display: inline-block;
      margin-top: 8px;
      padding: 12px 18px;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    .ok { color: #059669; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ShareMe OAuth 回调页</h1>
    <p class="ok">页面已成功部署。</p>
    <p id="status">
      若从 App 授权跳转而来，正在尝试返回 ShareMe…
    </p>
    <p>
      <a class="btn" id="openApp" href="sherit://oauth-callback">打开 ShareMe</a>
    </p>
    <p style="font-size:13px;color:#94a3b8;">
      在电脑浏览器打开时保持空白/无法进 App 是正常的；请在手机 ShareMe 里完成授权。
    </p>
  </div>
  <script>
    (function () {
      var q = window.location.search || '';
      var hash = window.location.hash || '';
      var target = 'sherit://oauth-callback' + q + hash;
      var link = document.getElementById('openApp');
      var status = document.getElementById('status');
      link.href = target;

      // 有授权参数时才自动跳转（避免你在电脑上验收时立刻跳走变「空白」）。
      if (q || (hash && hash.length > 1)) {
        status.textContent = '检测到授权参数，正在返回 ShareMe…';
        setTimeout(function () {
          window.location.replace(target);
        }, 300);
      } else {
        status.textContent = '当前没有授权参数。这只是部署检查页，可忽略。';
      }
    })();
  </script>
</body>
</html>

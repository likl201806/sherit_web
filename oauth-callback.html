<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShareMe OAuth</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      color: #1a1a1a;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 420px; }
    a { color: #2563eb; }
  </style>
  <script>
    // Android Auth Tab 通常会拦截本 URL，不会真正打开此页。
    // 若落到外部浏览器，则把 query 转到自定义 scheme 作为兜底。
    (function () {
      var q = window.location.search || '';
      var target = 'sherit://oauth-callback' + q;
      window.location.replace(target);
      setTimeout(function () {
        var el = document.getElementById('hint');
        if (el) el.style.display = 'block';
      }, 800);
    })();
  </script>
</head>
<body>
  <div class="card">
    <p>正在返回 ShareMe…</p>
    <p id="hint" style="display:none;font-size:14px;color:#666;">
      若未自动跳转，请手动回到 ShareMe App，或
      <a id="openApp" href="#">点此打开</a>。
    </p>
  </div>
  <script>
    document.getElementById('openApp').href =
      'sherit://oauth-callback' + (window.location.search || '');
  </script>
</body>
</html>
